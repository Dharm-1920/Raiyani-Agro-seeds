# MongoDB only. Run the API, client and Python service with the commands in README.md
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (!rs.status().ok) quit(1); } catch (e) { if (e.code === 94) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}); quit(1); } else { throw e; } }"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
