plugins {
    id 'com.android.application'
}

// Instant notifications turn on when the Firebase config file is placed next to this build file.
def firebaseConfigured = file('google-services.json').exists()
if (firebaseConfigured) apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.raiyani.agroseeds'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raiyani.agroseeds'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'boolean', 'FIREBASE', "${firebaseConfigured}"
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
